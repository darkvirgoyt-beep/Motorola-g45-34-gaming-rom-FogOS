name: FogOS Elite Gaming ROM - Source Compilation (fogos)

on:
  workflow_dispatch:
    inputs:
      android_branch:
        description: 'Android Base Version (LineageOS / AOSP)'
        required: true
        default: 'lineage-22.0'
        type: choice
        options:
          - 'lineage-22.0'
          - 'lineage-21.0'
          - 'lineage-23.0'
          - 'main'
      ram_target:
        description: 'RAM Variant Optimization Target'
        required: true
        default: 'unified-4gb-8gb'
        type: choice
        options:
          - 'unified-4gb-8gb'
          - '4gb-optimized'
          - '8gb-optimized'
      build_type:
        description: 'Build variant (userdebug / eng / user)'
        required: true
        default: 'userdebug'
        type: choice
        options:
          - 'userdebug'
          - 'eng'
          - 'user'

jobs:
  compile-source:
    name: Compile FogOS Gaming ROM from Source
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Checkout FogOS Repository
        uses: actions/checkout@v4

      - name: Maximize Runner Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          sudo rm -rf /opt/hostedtoolcache
          sudo rm -rf /usr/share/swift
          df -h

      - name: Setup Build Packages and Git
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            bc bison build-essential ccache curl flex g++-multilib gcc-multilib git git-lfs \
            gnupg gperf imagemagick libelf-dev liblz4-tool libncurses-dev libssl-dev \
            libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc \
            zip zlib1g-dev python3 python-is-python3 openjdk-17-jdk

          sudo curl https://storage.googleapis.com/git-repo-downloads/repo -o /usr/local/bin/repo
          sudo chmod +x /usr/local/bin/repo

          git config --global user.name "VirgoYT"
          git config --global user.email "darkvirgoyt@gmail.com"

      - name: Initialize LineageOS Source Tree
        run: |
          mkdir -p /home/runner/work/lineage
          cd /home/runner/work/lineage
          repo init -u https://github.com/LineageOS/android.git -b ${{ github.event.inputs.android_branch }} --git-lfs --depth=1

      - name: Setup Device Tree for Motorola G45 / G34 5G (fogos)
        run: |
          cd /home/runner/work/lineage
          mkdir -p .repo/local_manifests
          cat << 'MANIFEST' > .repo/local_manifests/fogos.xml
          <?xml version="1.0" encoding="UTF-8"?>
          <manifest>
            <project name="LineageOS/android_device_motorola_fogos" path="device/motorola/fogos" remote="github" revision="${{ github.event.inputs.android_branch }}" />
            <project name="LineageOS/android_device_motorola_sm6375-common" path="device/motorola/sm6375-common" remote="github" revision="${{ github.event.inputs.android_branch }}" />
            <project name="TheMuppets/proprietary_vendor_motorola_fogos" path="vendor/motorola/fogos" remote="github" revision="${{ github.event.inputs.android_branch }}" />
            <project name="TheMuppets/proprietary_vendor_motorola_sm6375-common" path="vendor/motorola/sm6375-common" remote="github" revision="${{ github.event.inputs.android_branch }}" />
            <project name="LineageOS/android_kernel_motorola_sm6375" path="kernel/motorola/sm6375" remote="github" revision="${{ github.event.inputs.android_branch }}" />
            <project name="LineageOS/android_hardware_motorola" path="hardware/motorola" remote="github" revision="${{ github.event.inputs.android_branch }}" />
            <project name="RisingOS-Revived/android_packages_apps_GameSpace" path="packages/apps/GameSpace" remote="github" revision="fifteen" />
          </manifest>
          MANIFEST

      - name: Sync Source Repositories
        run: |
          cd /home/runner/work/lineage
          repo sync -c -j$(nproc --all) --force-sync --no-clone-bundle --no-tags --depth=1

      - name: Apply FogOS Device Tree Overlays & Dynamic RAM Tuner
        run: |
          cd /home/runner/work/lineage
          mkdir -p device/motorola/fogos/overlay
          cp -r $GITHUB_WORKSPACE/overlay/* device/motorola/fogos/overlay/ || true
          mkdir -p device/motorola/fogos/rootdir
          cp -r $GITHUB_WORKSPACE/rootdir/* device/motorola/fogos/rootdir/ || true
          cp $GITHUB_WORKSPACE/system_ext.prop device/motorola/fogos/system_ext.prop || true
          mkdir -p device/motorola/fogos/sysconfig
          cp -r $GITHUB_WORKSPACE/sysconfig/* device/motorola/fogos/sysconfig/ || true
          mkdir -p device/motorola/fogos/patches
          cp -r $GITHUB_WORKSPACE/patches/* device/motorola/fogos/patches/ || true

      - name: Inject FogOS Elite Gaming Customizations & 4GB/8GB Dual Support
        run: |
          cd /home/runner/work/lineage
          cat $GITHUB_WORKSPACE/patches/fogos_gaming.prop >> device/motorola/fogos/system.prop || true
          cat << 'PROPS' >> device/motorola/fogos/system.prop
          # FogOS Elite Gaming Core Attributes
          ro.build.display.id=FogOS-v1.0-EliteGaming-VirgoYT
          ro.fogos.version=1.0-EliteGaming
          ro.fogos.base=LineageOS
          ro.fogos.target.android=17
          ro.fogos.ram.support=4GB-8GB-Unified
          ro.fogos.maintainer=Prince · VirgoYT
          ro.surface_flinger.use_content_detection_for_refresh_rate=false
          ro.surface_flinger.set_idle_timer_ms=0
          ro.surface_flinger.set_touch_timer_ms=5
          windowsmgr.max_events_per_sec=240
          debug.sf.disable_backpressure=1
          persist.sys.game_mode=1
          PROPS

      - name: Compile FogOS Custom ROM
        run: |
          cd /home/runner/work/lineage
          export BUILD_USERNAME=VirgoYT
          export BUILD_HOSTNAME=fogos-gaming-build
          export CCACHE_EXEC=/usr/bin/ccache
          export CCACHE_DIR=/home/runner/.ccache
          ccache -M 50G
          ccache -o compression=true
          source build/envsetup.sh
          croot
          breakfast fogos
          mka bacon -j$(nproc)

      - name: Publish Compiled ROM Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd /home/runner/work/lineage/out/target/product/fogos
          ROM_ZIP=$(ls lineage-*-fogos.zip | head -n 1)

          # Extract payload.bin and metadata directly from the compiled source package
          mkdir -p payload_out
          unzip -q -o "$ROM_ZIP" "payload.bin" "payload_properties.txt" "care_map.pb" "apex_info.pb" -d payload_out/ || true

          RELEASE_FILES=("$ROM_ZIP" "boot.img")
          [ -f "payload_out/payload.bin" ] && RELEASE_FILES+=("payload_out/payload.bin")
          [ -f "payload_out/payload_properties.txt" ] && RELEASE_FILES+=("payload_out/payload_properties.txt")
          [ -f "recovery.img" ] && RELEASE_FILES+=("recovery.img")
          [ -f "dtbo.img" ] && RELEASE_FILES+=("dtbo.img")
          [ -f "vendor_boot.img" ] && RELEASE_FILES+=("vendor_boot.img")
          [ -f "super_empty.img" ] && RELEASE_FILES+=("super_empty.img")

          sha256sum "${RELEASE_FILES[@]}" > SHA256SUMS.txt
          RELEASE_FILES+=("SHA256SUMS.txt")

          gh release create "FogOS-Source-$(date +'%Y%m%d')" "${RELEASE_FILES[@]}" \
            --title "👑 FogOS Elite Gaming Edition (Android 17 Source / payload.bin) — Motorola G45 / G34" \
            --notes "Official LineageOS/FogOS 400GB+ full source compilation for Motorola Moto G45 5G / G34 5G (fogos). Includes official signed OTA with payload.bin, standalone payload.bin, VirgoYT Gaming Kernel, and dynamic 4GB/8GB RAM engine."
