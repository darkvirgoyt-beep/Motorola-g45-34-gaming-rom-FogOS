name: FogOS Gaming ROM - Build

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'
      - 'docs/**'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release version tag (e.g. v1.0-gaming)'
        required: false
        default: 'v1.0-gaming'
      prerelease:
        description: 'Mark as pre-release / beta'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

jobs:
  build:
    name: Build FogOS Gaming ROM
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Free Runner Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          df -h

      - name: Checkout FogOS ROM Builder
        uses: actions/checkout@v4

      - name: Install Dependencies and Payload Dumper
        run: |
          sudo apt-get update
          sudo apt-get install -y curl jq unzip zip wget
          curl -sL https://github.com/ssut/payload-dumper-go/releases/download/1.3.0/payload-dumper-go_1.3.0_linux_amd64.tar.gz | sudo tar -xz -C /usr/local/bin/
          payload-dumper-go -h || true

      - name: Build FogOS Gaming ROM
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x tools/build_rom.sh
          ./tools/build_rom.sh

      - name: Create or Update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event.inputs.release_tag }}"
          [ -z "$TAG" ] && TAG="FogOS-v1.0-$(date +'%Y%m%d-%H%M')"

          PRERELEASE_FLAG=""
          if [ "${{ github.event.inputs.prerelease }}" = "true" ]; then
            PRERELEASE_FLAG="--prerelease"
          fi

          ZIP_FILE=$(ls FogOS-*.zip | head -n 1)

          cat << 'NOTES' > release_notes.md
          ### 🚀 FogOS Elite Gaming Edition v1.0 for Motorola Moto G45 5G / G34 5G (fogos)
          **Developer & Maintainer:** Prince · VirgoYT (@darkvirgoyt-beep)
          **Base:** Android 14 / Holi SM6375 Platform

          ---

          ### 🎮 Elite Gaming Features:
          - **VirgoYT Gaming Kernel:** CPU & GPU sched-boost, Adreno 619 clock force, touchboost (60ms).
          - **Dynamic Profiles via QS Tiles & PulseControl:** Powersave, Balanced, and Elite Gaming modes.
          - **120Hz Refresh Rate Lock:** Hard-locked SurfaceFlinger refresh rate without throttling.
          - **240Hz Touch Sampling Rate:** Zero debounce latency (`persist.sys.touch.debounce_ms=0`).
          - **Swappy & VK_EXT_present_timing:** Android Frame Pacing enabled for Vulkan & OpenGL.
          - **Game Spoofing:** ROG Phone 8 Pro device profile for BGMI / PUBG Mobile 90/120 FPS.
          - **Storage & I/O:** BFQ scheduler with 512KB readahead.
          - **Multiplayer Low Ping:** Google BBR TCP congestion control with low-latency socket buffers.

          ---

          ### 🏦 Google Play Integrity & Banking Setup:
          - Pre-configured `release-keys`, `ro.debuggable=0`, `ro.secure=1`, and green boot state.
          - Flash with `--disable-verity --disable-verification` to bypass dm-verity.
          - Use KernelSU or Magisk + Zygisk + Denylist (GPay, PhonePe, Paytm).
          - Pre-packaged **PlayIntegrityFix** module included in `modules/` folder!

          ---

          ### 📦 Flashing Instructions:
          1. Extract the downloaded ZIP package on your PC.
          2. Reboot your Motorola G45 into Bootloader / Fastboot mode (`Power + Volume Down`).
          3. Connect your phone via USB.
          4. **Windows:** Double-click `flash_all.bat`.
          5. **Linux / Mac:** Run `chmod +x flash_all.sh && ./flash_all.sh`.
          6. Select **Y** to format userdata if this is your first time flashing.
          7. Reboot and enjoy smooth high-FPS gaming!

          ---
          Credits to Prince · VirgoYT707 and the SM6375 Dev Community.
          NOTES

          # Collect release assets
          RELEASE_ASSETS=("$ZIP_FILE" "out/boot.img" "out/SHA256SUMS.txt")
          [ -f "out/tools/FogOS-PulseControl.apk" ] && RELEASE_ASSETS+=("out/tools/FogOS-PulseControl.apk")
          [ -f "out/tools/SmartPack-Kernel-Manager.apk" ] && RELEASE_ASSETS+=("out/tools/SmartPack-Kernel-Manager.apk")
          [ -f "out/modules/PlayIntegrityFix.zip" ] && RELEASE_ASSETS+=("out/modules/PlayIntegrityFix.zip")

          # Create release if new, or upload assets if tag exists
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "[*] Release $TAG exists, updating assets..."
            gh release upload "$TAG" "${RELEASE_ASSETS[@]}" --clobber
          else
            echo "[*] Creating new release $TAG..."
            gh release create "$TAG" "${RELEASE_ASSETS[@]}" \
              --title "👑 FogOS Elite Gaming Edition v1.0 — Motorola G45 / G34 5G (fogos)" \
              --notes-file release_notes.md \
              $PRERELEASE_FLAG
          fi
