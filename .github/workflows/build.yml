name: FogOS Gaming ROM - Build

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'
      - 'docs/**'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release version tag (e.g. v1.0-gaming)'
        required: false
        default: 'v1.0-gaming'
      prerelease:
        description: 'Mark as pre-release / beta'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

jobs:
  build:
    name: Build FogOS Gaming ROM
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Free Runner Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          df -h

      - name: Checkout FogOS ROM Builder
        uses: actions/checkout@v4

      - name: Install Dependencies and Payload Dumper
        run: |
          sudo apt-get update
          sudo apt-get install -y curl jq unzip zip wget
          curl -sL https://github.com/ssut/payload-dumper-go/releases/download/1.3.0/payload-dumper-go_1.3.0_linux_amd64.tar.gz | sudo tar -xz -C /usr/local/bin/
          payload-dumper-go -h || true

      - name: Build FogOS Gaming ROM
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x tools/build_rom.sh
          ./tools/build_rom.sh

      - name: Create or Update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event.inputs.release_tag }}"
          [ -z "$TAG" ] && TAG="FogOS-v1.0-$(date +'%Y%m%d-%H%M')"

          PRERELEASE_FLAG=""
          if [ "${{ github.event.inputs.prerelease }}" = "true" ]; then
            PRERELEASE_FLAG="--prerelease"
          fi

          ZIP_FILE=$(ls FogOS-*.zip | grep -v -- '-sideload.zip' | grep -v -- '-Official-OTA.zip' | head -n 1)
          SIDELOAD_ZIP=$(ls FogOS-*-sideload.zip 2>/dev/null | head -n 1)
          OTA_ZIP=$(ls FogOS-*-Official-OTA.zip 2>/dev/null | head -n 1)

          cat << 'NOTES' > release_notes.md
          ### 🚀 FogOS Elite Gaming Edition v1.0 — Motorola Moto G45 5G / G34 5G (fogos)
          **Developer & Maintainer:** Prince · VirgoYT (@darkvirgoyt-beep)
          **Base System:** LineageOS Platform (Android 17 / Forward-Compatible Core)
          **Hardware Support:** Motorola Moto G45 5G & G34 5G (Qualcomm Snapdragon 6s Gen 3 / SM6375)

          ---

          ### 🧠 Adaptive Dual-RAM Architecture (4GB & 8GB Variants):
          - **4GB RAM Variant:**
            - Auto-detected on boot (`MemTotal < 5GB`).
            - 3.5 GB zRAM with fast LZ4 compression.
            - `vm.swappiness = 160` + aggressive LMKD foreground game priority to prevent OOM lag and frame drops.
            - Tuned Dalvik ART memory thresholds (192MB growth limit, 512MB max heap).
          - **8GB RAM Variant:**
            - Auto-detected on boot (`MemTotal >= 5GB`).
            - 4.0 GB zRAM with high-throughput ZSTD/LZ4.
            - `vm.swappiness = 60` + `vfs_cache_pressure = 50` to keep map textures and game assets cached directly in RAM.
            - Expanded ART heap (256MB growth limit, 768MB max heap) for seamless multitasking.

          ---

          ### 🎮 Elite Gaming Features:
          - **Customized Beyond LineageOS:** Built from the ground up as a competitive gaming ROM, not vanilla Lineage.
          - **VirgoYT Gaming Kernel:** CPU & GPU sched-boost, Adreno 619 clock lock (up to 950MHz), touchboost (60ms).
          - **Aim & Gyro Precision:** 100Hz IMU polling rate (`SENSOR_RATE_FASTEST`) routed to Hexagon DSP for instant BGMI/COD gyro tracking.
          - **240Hz Touch Sampling Rate:** Zero debounce latency (`persist.sys.touch.debounce_ms=0`, `touch_delay_ms=5`).
          - **120Hz Refresh Rate Lock:** Hard-locked SurfaceFlinger refresh rate without thermal throttling dips.
          - **Game Spoofing:** ROG Phone 8 Pro profile to unlock 90/120 FPS in BGMI, PUBG Mobile, and Call of Duty Mobile.
          - **Low Ping Network Engine:** Google BBR/BBR2 TCP congestion control with 26MB socket buffers.

          ---

          ### 🏦 Google Play Integrity & Banking Setup:
          - Pre-configured `release-keys`, `ro.debuggable=0`, `ro.secure=1`, and green boot state.
          - Flash with `--disable-verity --disable-verification` to bypass dm-verity.
          - Use KernelSU or Magisk + Zygisk + Denylist (GPay, PhonePe, Paytm).
          - Pre-packaged **PlayIntegrityFix** module included in `modules/` folder!

          ---

          ### 📦 Flashing Instructions:
          1. Extract the downloaded ZIP package on your PC.
          2. Reboot your Motorola G45 into Bootloader / Fastboot mode (`Power + Volume Down`).
          3. Connect your phone via USB.
          4. **Windows:** Double-click `flash_all.bat`.
          5. **Linux / Mac:** Run `chmod +x flash_all.sh && ./flash_all.sh`.
          6. Select **Y** to format userdata if this is your first time flashing.
          7. Reboot and enjoy smooth high-FPS gaming!

          ### 📥 Sideload Method (`adb apply update`):
          Prefer fastboot for first install. For updates, sideload the `*-sideload.zip`:
          1. Boot to Recovery → `Factory reset` → `Format data` (first time only).
          2. `Apply update` → `Apply from ADB`.
          3. `adb sideload FogOS-*-sideload.zip`
          4. It flashes the FogOS gaming kernel (boot/vendor_boot/dtbo) and installs configs to `/data/fogos`.

          ---
          Credits to Prince · VirgoYT707 and the SM6375 Dev Community.
          NOTES

          # Collect release assets
          RELEASE_ASSETS=("$ZIP_FILE" "out/boot.img" "out/SHA256SUMS.txt")
          [ -n "$OTA_ZIP" ] && [ -f "$OTA_ZIP" ] && RELEASE_ASSETS+=("$OTA_ZIP")
          [ -f "out/payload.bin" ] && RELEASE_ASSETS+=("out/payload.bin")
          [ -f "out/payload_properties.txt" ] && RELEASE_ASSETS+=("out/payload_properties.txt")
          [ -f "out/vbmeta.img" ] && RELEASE_ASSETS+=("out/vbmeta.img")
          [ -f "out/vbmeta_system.img" ] && RELEASE_ASSETS+=("out/vbmeta_system.img")
          [ -f "out/dtbo.img" ] && RELEASE_ASSETS+=("out/dtbo.img")
          [ -f "out/vendor_boot.img" ] && RELEASE_ASSETS+=("out/vendor_boot.img")
          [ -n "$SIDELOAD_ZIP" ] && [ -f "$SIDELOAD_ZIP" ] && RELEASE_ASSETS+=("$SIDELOAD_ZIP")
          [ -f "out/tools/FogOS-PulseControl.apk" ] && RELEASE_ASSETS+=("out/tools/FogOS-PulseControl.apk")
          [ -f "out/tools/SmartPack-Kernel-Manager.apk" ] && RELEASE_ASSETS+=("out/tools/SmartPack-Kernel-Manager.apk")
          [ -f "out/modules/PlayIntegrityFix.zip" ] && RELEASE_ASSETS+=("out/modules/PlayIntegrityFix.zip")

          # Create release if new, or upload assets if tag exists
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "[*] Release $TAG exists, updating assets..."
            gh release upload "$TAG" "${RELEASE_ASSETS[@]}" --clobber
          else
            echo "[*] Creating new release $TAG..."
            gh release create "$TAG" "${RELEASE_ASSETS[@]}" \
              --title "👑 FogOS Elite Gaming Edition v1.0 — Motorola G45 / G34 5G (fogos)" \
              --notes-file release_notes.md \
              $PRERELEASE_FLAG
          fi
